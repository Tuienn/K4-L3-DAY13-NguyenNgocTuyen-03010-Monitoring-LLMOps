service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    Mục tiêu 99.5% request trả thành công trong 3000ms trên cửa sổ trượt 28 ngày.
    Baseline fake LLM có TTFT khoảng 50ms; ngưỡng 3000ms dành headroom cho retrieval và prompt fetch.
    CP0 có prompt fetch fallback nên latency chưa phản ánh managed-prompt warm cache; CP2 đo lại sau tạo prompt.
    Workload lab nhỏ không đủ chứng minh SLO 28 ngày; đây là mục tiêu vận hành, không phải kết luận đạt SLO dài hạn.
  error_budget_formula: 'allowed_bad_requests = floor(total_requests * 0.005); remaining = allowed_bad_requests - bad_requests'
  example_total_requests: 10000
  example_allowed_bad_requests: 50
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
