<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 13 · LLM Operations</title>
<style>
:root{--ink:#17283a;--muted:#52667a;--accent:#17679a;--line:#cfdae3;--warn:#ae542c;--paper:#eef3f7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,sans-serif}main{max-width:1400px;margin:24px auto;padding:0 28px}header{border-top:6px solid var(--accent);display:flex;justify-content:space-between;align-items:center;padding:18px 0}h1{font:600 30px Georgia,serif;margin:0}header p{margin:6px 0;color:var(--muted)}button{padding:10px 18px;background:var(--accent);color:white;border:0;border-radius:3px;cursor:pointer}button:focus-visible{outline:3px solid var(--warn);outline-offset:3px}.range{background:#dce7ef;padding:12px;margin-bottom:18px;font:13px ui-monospace,monospace}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}section{background:white;border:1px solid var(--line);padding:18px;min-height:270px}h2{font-size:17px;margin:0 0 12px}.values{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px}.value{font:600 22px ui-monospace,monospace}.label,.note{font-size:12px;color:var(--muted)}.threshold{margin-top:10px;color:var(--warn);font-size:12px}.chart{width:100%;height:108px}.axis{font:10px system-ui;fill:var(--muted)}.legend{font-size:12px;line-height:1.6}footer{margin:18px 0;color:var(--muted);font-size:12px}#error{color:var(--warn)}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.grid{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:23px}main{padding:0 14px}}
</style>
<main><header><div><h1>LLM operations / Day 13</h1><p>K4-L3B · Nguyen Ngoc Tuyen · 03010</p></div><button id="refresh">Refresh</button></header><div id="range" class="range"></div><p id="error" role="status"></p><div id="panels" class="grid"></div><footer>Metrics → Logs → Traces · Open the matching correlation ID in Langfuse to investigate. Cost uses lab token price estimates; quality is a heuristic proxy.</footer></main>
<script>
const snapshot=__SNAPSHOT__;
const fmt=(x,d=2)=>x===null?'N/A':Number(x).toLocaleString('en-US',{maximumFractionDigits:d});
const labels={p50:'P50',p95:'P95',p99:'P99',ttft_p95:'TTFT P95',count:'Requests',rate_per_minute:'Mean / min',error_rate_pct:'Error rate',tool_success_rate_pct:'Retrieval success',total:'Total cost',tokens_in:'Input',tokens_out:'Output',mean:'Mean quality'};
function chart(items,threshold,unit){const w=340,h=104,left=38,bottom=82;let top=Math.max(...items.map(x=>x[1]??0),threshold??0,0.000001)*1.12;let x=i=>left+(i/Math.max(items.length-1,1))*285,y=v=>bottom-(v/top)*64;let points=items.map((v,i)=>v[1]===null?null:`${x(i)},${y(v[1])}`).filter(Boolean);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${unit} chart"><line x1="${left}" y1="${bottom}" x2="330" y2="${bottom}" stroke="#cfdae3"/><text x="0" y="16" class="axis">${fmt(top,3)}</text><text x="0" y="${bottom}" class="axis">0</text>${threshold===null?'':`<line x1="${left}" x2="330" y1="${y(threshold)}" y2="${y(threshold)}" stroke="#ae542c" stroke-dasharray="4 3"/>`}${items.map((v,i)=>v[1]===null?'':`<circle cx="${x(i)}" cy="${y(v[1])}" r="2" fill="#17679a"/>`).join('')}${points.length?`<polyline points="${points.join(' ')}" fill="none" stroke="#17679a" stroke-width="2"/>`:''}<text x="${left}" y="101" class="axis">${items[0]?.[0]??''}</text><text x="280" y="101" class="axis">${items.at(-1)?.[0]??''}</text></svg>`}
function render(d){document.getElementById('range').textContent=`${d.source} · Last 60 minutes · ${d.start.slice(0,19)} → ${d.end.slice(0,19)} UTC · Refresh ${d.refresh_seconds}s${snapshot?' · Captured runtime snapshot':''}`;document.getElementById('panels').innerHTML='';for(const p of d.panels){const el=document.createElement('section');const t=p.threshold;let vals=Object.entries(p.values).filter(([k])=>k!=='count_by_value');let body=vals.map(([k,v])=>`<div><div class="value">${fmt(v,p.id==='cost'?6:2)}</div><div class="label">${labels[k]} · ${k==='count'?'requests':p.unit}</div></div>`).join('');let plot='';if(['latency','traffic','cost','errors'].includes(p.id)){const key={latency:'latency_p95',traffic:'traffic',cost:'cost',errors:'error_rate_pct'}[p.id];plot=chart(d.timeline.map(r=>[r.minute.slice(11,16),r[key]]),p.id==='cost'?null:t.value,p.unit);plot+=`<div class="legend">Time (UTC) → ${p.id==='cost'?'Cost / minute (USD)':p.id==='latency'?'Latency P95 (ms)':p.id==='traffic'?'Requests / minute':'Error rate (%)'}</div>`}else{plot=chart(vals.map(([k,v])=>[labels[k],v]),t.value,p.unit)}let extra=p.id==='errors'?`<div class="note">Error breakdown: ${Object.entries(p.values.count_by_value).map(([k,v])=>`${k}: ${v}`).join(', ')||'none'} · Retrieval target ≥ 90%</div>`:'';el.innerHTML=`<h2>${p.title}</h2><div class="values">${body}</div>${plot}<div class="threshold">Threshold: ${t.aggregation} ${t.operator==='lte'?'≤':'≥'} ${t.value} ${p.unit}</div>${extra}`;document.getElementById('panels').append(el)}document.getElementById('error').textContent=d.invalid_lines?`${d.invalid_lines} malformed log lines skipped`:''}
async function refresh(){try{if(snapshot){render(snapshot);return}const r=await fetch('/dashboard/data');if(!r.ok)throw Error(`HTTP ${r.status}`);render(await r.json())}catch(e){document.getElementById('error').textContent=`Cannot read dashboard data: ${e.message}`}}
document.getElementById('refresh').onclick=refresh;refresh();if(!snapshot)setInterval(refresh,30000);
</script></html>
